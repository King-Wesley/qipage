name: Clock style checks
on:
  push:
    branches: [feature/clock-styles]
  pull_request:
    paths: ['app.js', 'style-config.js', 'index.html', 'style.css', 'server.cjs', 'tests/**', 'package*.json', '.github/workflows/style-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
